[package]
name = "captcha_nif"
version = "0.1.0"
authors = []
edition = "2018"

[lib]
name = "captcha_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
captcha = "1.0.0"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
